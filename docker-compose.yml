services:
  heaven-search:
    build: .
    container_name: heaven-search
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Persist the database and embeddings between restarts
      - ./data:/app/data
      # Password file — avoids docker-compose $ escaping issues
      - ./admin_password_hash:/run/secrets/admin_password_hash:ro
    environment:
      # Auth — set these!
      - HEAVEN_API_KEY=${HEAVEN_API_KEY:-}
      - HEAVEN_JWT_SECRET=${HEAVEN_JWT_SECRET:-change-me-in-production}
      - HEAVEN_ADMIN_USER=${HEAVEN_ADMIN_USER:-admin}
      - HEAVEN_ADMIN_PASSWORD_HASH=${HEAVEN_ADMIN_PASSWORD_HASH:-}
      # Or mount a password file to avoid $ escaping in docker-compose
      - HEAVEN_ADMIN_PASSWORD_FILE=/run/secrets/admin_password_hash
      # Embedding backend
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-auto}
      - VERTEX_API_KEY=${VERTEX_API_KEY:-${VERTEX_AI_API_KEY:-}}
      - VERTEX_PROJECT=${VERTEX_PROJECT:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    restart: unless-stopped
    # Resource limits for old hardware
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

networks:
  default:
    name: docker_backend
    external: true
