<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heavenletters Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --cream: #f9f0d9;
    --white: #ffffff;
    --charcoal: #403f3e;
    --ab-standard: #2e82f5;
    --ab-light: #d8e8fd;
    --ab-dark: #084eaf;
    --mb-standard: #ED2960;
    --mb-light: #f8b4c7;
    --mb-dark: #bb1141;
    --bl-standard: #FDE80F;
    --bl-light: #fef9c2;
    --beige: #b7b2a3;
  }

  body {
    font-family: 'Lexend', sans-serif;
    background-color: var(--cream);
    color: var(--charcoal);
    font-size: 1.125rem;
    line-height: 1.75;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1, h2, h3, h4 { font-family: 'EB Garamond', serif; }

  header {
    width: 100%;
    padding: 3rem 1.5rem 0;
    text-align: center;
  }

  header h1 {
    font-size: 2.4rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--mb-standard);
  }

  header p {
    font-size: 1.05rem;
    color: var(--charcoal);
    opacity: 0.7;
    margin-top: 0.35rem;
  }

  main {
    width: 100%;
    max-width: 760px;
    padding: 2rem 1.5rem 4rem;
  }

  /* ── Login ─────────────────────────────────────────── */
  #login-screen {
    max-width: 400px;
    margin: 5rem auto 0;
    background: var(--white);
    border: 1px solid var(--beige);
    border-radius: 0.75rem;
    padding: 2.5rem 2rem;
  }

  #login-screen h2 {
    font-family: 'EB Garamond', serif;
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
    color: var(--charcoal);
  }

  #login-screen label {
    display: block;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--charcoal);
    opacity: 0.7;
    margin-bottom: 0.35rem;
  }

  #login-screen input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid var(--beige);
    border-radius: 0.5rem;
    font-size: 1.05rem;
    font-family: 'Lexend', sans-serif;
    margin-bottom: 1.25rem;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    background: var(--white);
  }

  #login-screen input:focus {
    border-color: var(--ab-standard);
    box-shadow: 0 0 0 3px var(--ab-light);
  }

  #login-screen button {
    width: 100%;
    padding: 0.75rem;
    background: var(--mb-standard);
    color: white;
    border: none;
    border-radius: 0.5rem;
    font-size: 1.05rem;
    font-family: 'Lexend', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }

  #login-screen button:hover { background: var(--mb-dark); }
  #login-screen .error { color: var(--mb-dark); font-size: 0.9rem; margin-top: 0.75rem; min-height: 1.4em; }

  /* ── Search ─────────────────────────────────────────── */
  #search-screen { display: none; }

  .search-bar {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .search-bar input[type="text"] {
    flex: 1;
    padding: 0.85rem 1.25rem;
    border: 1px solid var(--beige);
    border-radius: 0.5rem;
    font-size: 1.1rem;
    font-family: 'Lexend', sans-serif;
    outline: none;
    background: var(--white);
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .search-bar input[type="text"]:focus {
    border-color: var(--ab-standard);
    box-shadow: 0 0 0 3px var(--ab-light);
  }

  .search-bar button {
    padding: 0.85rem 1.75rem;
    background: var(--ab-standard);
    color: white;
    border: none;
    border-radius: 0.5rem;
    font-size: 1.05rem;
    font-family: 'Lexend', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .search-bar button:hover { background: var(--ab-dark); }

  #share-btn {
    background: var(--white) !important;
    color: var(--ab-standard) !important;
    border: 1px solid var(--beige) !important;
  }
  #share-btn:hover { background: var(--ab-light) !important; }

  .search-options {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 2rem;
    font-size: 0.95rem;
    flex-wrap: wrap;
  }

  .search-options label {
    color: var(--charcoal);
    opacity: 0.7;
  }

  .search-options select {
    padding: 0.45rem 0.75rem;
    border: 1px solid var(--beige);
    border-radius: 0.4rem;
    font-size: 0.9rem;
    font-family: 'Lexend', sans-serif;
    background: var(--white);
    color: var(--charcoal);
  }

  .backend-badge {
    margin-left: auto;
    font-size: 0.85rem;
    padding: 0.2rem 0.75rem;
    border-radius: 0.4rem;
    background: var(--bl-light);
    color: var(--charcoal);
    opacity: 0.8;
  }

  /* ── Results ────────────────────────────────────────── */
  .status {
    text-align: center;
    color: var(--charcoal);
    opacity: 0.5;
    padding: 3rem 0;
    font-size: 1.05rem;
  }

  .result {
    background: var(--white);
    border: 1px solid var(--beige);
    border-radius: 0.6rem;
    padding: 1.5rem 1.75rem;
    margin-bottom: 1rem;
    transition: box-shadow 0.15s;
  }

  .result:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.6rem;
    gap: 1rem;
  }

  .result-title {
    font-family: 'EB Garamond', serif;
    font-size: 1.25rem;
    font-weight: 600;
  }

  .result-title a {
    color: var(--charcoal);
    text-decoration: none;
  }

  .result-title a:hover { color: var(--mb-standard); }

  .result-number {
    font-size: 0.9rem;
    color: var(--beige);
    white-space: nowrap;
  }

  .result-excerpt {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--charcoal);
    opacity: 0.85;
  }

  .result-meta {
    display: flex;
    gap: 1rem;
    margin-top: 0.75rem;
    font-size: 0.8rem;
    color: var(--beige);
  }

  .result-meta span {
    background: var(--cream);
    padding: 0.15rem 0.5rem;
    border-radius: 0.3rem;
  }

  /* ── Analysis ───────────────────────────────────────── */
  #analyze-result {
    margin-top: 3rem;
    background: var(--white);
    border: 1px solid var(--beige);
    border-left: 4px solid var(--mb-standard);
    padding: 2rem;
    border-radius: 0 0.6rem 0.6rem 0;
    font-size: 1rem;
    line-height: 1.75;
    display: none;
  }

  #analyze-result h3 {
    font-family: 'EB Garamond', serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--mb-standard);
    margin-bottom: 1rem;
  }

  #analyze-result h4 {
    font-family: 'EB Garamond', serif;
    font-weight: 600;
    margin: 1.25rem 0 0.5rem;
    font-size: 1.15rem;
    color: var(--charcoal);
  }

  #analyze-result p { margin-bottom: 0.65rem; }
  #analyze-result ul, #analyze-result ol { margin: 0.35rem 0 0.65rem 1.75rem; }
  #analyze-result li { margin-bottom: 0.3rem; }
  #analyze-result strong { color: var(--ab-dark); font-weight: 600; }
  #analyze-result em { color: var(--charcoal); opacity: 0.8; }
  #analyze-result blockquote {
    border-left: 3px solid var(--bl-standard);
    padding-left: 1rem;
    color: var(--charcoal);
    opacity: 0.75;
    margin: 0.75rem 0;
    font-style: italic;
    font-family: 'EB Garamond', serif;
  }

  .source-list {
    margin-bottom: 1.25rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--beige);
    font-size: 0.95rem;
    color: var(--charcoal);
    opacity: 0.75;
  }

  .source-item { margin-right: 0.5rem; }
  .source-item a {
    color: var(--ab-standard);
    text-decoration: none;
  }
  .source-item a:hover { text-decoration: underline; }

  /* ── Logout ─────────────────────────────────────────── */
  .logout {
    position: absolute;
    top: 1.25rem;
    right: 1.75rem;
    font-size: 0.9rem;
    color: var(--beige);
    cursor: pointer;
    font-family: 'Lexend', sans-serif;
  }
  .logout:hover { color: var(--mb-standard); }

  /* ── Spinner ────────────────────────────────────────── */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--ab-light);
    border-top-color: var(--ab-standard);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-left: 0.5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #search-btn.loading { opacity: 0.7; pointer-events: none; }
</style>
</head>
<body>

<!-- ═══ Login Screen ═══════════════════════════════════════════════ -->
<header>
  <h1>Heavenletters</h1>
  <p>Semantic Search — Private Beta</p>
</header>

<main>
<div id="login-screen">
  <h2>Sign in</h2>
  <label for="username">Username</label>
  <input type="text" id="username" placeholder="admin" autocomplete="username">
  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <button onclick="doLogin()">Sign in</button>
  <div class="error" id="login-error"></div>
</div>

<!-- ═══ Search Screen ══════════════════════════════════════════════ -->
<div id="search-screen">
  <span class="logout" onclick="doLogout()">sign out</span>

  <div class="search-bar">
    <input type="text" id="query" placeholder="Search 6,617 Heavenletters…" 
           autofocus onkeydown="if(event.key==='Enter')doSearch()">
    <button id="search-btn" onclick="doSearch()">Search</button>
    <button id="share-btn" onclick="doShare()" style="display:none" title="Create shareable link">Share</button>
  </div>

  <div class="search-options">
    <label for="mode">Mode:</label>
    <select id="mode">
      <option value="hybrid" selected>Hybrid</option>
      <option value="semantic">Semantic</option>
      <option value="keyword">Keyword</option>
    </select>

    <label for="top" style="margin-left:0.75rem">Results:</label>
    <select id="top">
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="20">20</option>
    </select>

    <label style="margin-left:1rem">
      <input type="checkbox" id="analyze-check" onchange="toggleAnalyze()"> Analyze
    </label>

    <span class="backend-badge" id="backend-badge">…</span>
  </div>

  <div id="results"></div>
  <div id="analyze-result"></div>
</div>
</main>

<script>
// ═══ State ══════════════════════════════════════════════════════════
const API = '';
let token = localStorage.getItem('hl_token') || '';
let lastResults = null;
let lastAnalysis = null;
let lastQuery = '';
let lastMode = 'hybrid';
let lastBackend = '';

// ═══ Init ══════════════════════════════════════════════════════════
if (token) showSearch();
else showLogin();
fetchHealth();

async function fetchHealth() {
  try {
    const r = await fetch(API + '/health');
    const d = await r.json();
    const badge = document.getElementById('backend-badge');
    if (badge) {
      const b = d.backend === 'auto' ? 'Vertex' : d.backend;
      badge.textContent = '⚡ ' + b;
    }
  } catch(e) {}
}

// ═══ Login ═════════════════════════════════════════════════════════
function showLogin() {
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('search-screen').style.display = 'none';
  localStorage.removeItem('hl_token');
  token = '';
}

function showSearch() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('search-screen').style.display = 'block';
  document.getElementById('results').innerHTML = 
    '<div class="status">Enter a query to search the Heavenletters corpus</div>';
}

async function doLogin() {
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const err = document.getElementById('login-error');
  err.textContent = '';

  try {
    const r = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Login failed');
    token = d.access_token;
    localStorage.setItem('hl_token', token);
    showSearch();
  } catch(e) {
    err.textContent = e.message;
  }
}

function doLogout() { showLogin(); }

// ═══ Search ════════════════════════════════════════════════════════
async function doSearch() {
  const q = document.getElementById('query').value.trim();
  if (!q) return;

  const mode = document.getElementById('mode').value;
  const top = document.getElementById('top').value;
  const analyze = document.getElementById('analyze-check').checked;
  const btn = document.getElementById('search-btn');

  btn.classList.add('loading');
  btn.innerHTML = 'Searching<span class="spinner"></span>';
  document.getElementById('results').innerHTML = '';
  document.getElementById('analyze-result').style.display = 'none';

  try {
    const params = new URLSearchParams({ q, mode, top });
    const r = await fetch(API + '/search?' + params, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (r.status === 401) { showLogin(); return; }
    if (!r.ok) throw new Error('Search failed');

    const d = await r.json();
    lastResults = d.results;
    lastQuery = d.query;
    lastMode = d.mode;
    lastBackend = d.embedding_backend || '';
    lastAnalysis = null;
    renderResults(d);
    document.getElementById('share-btn').style.display = d.results && d.results.length > 0 ? 'inline-block' : 'none';

    if (analyze) { await doAnalyze(q, parseInt(top)); }
  } catch(e) {
    document.getElementById('results').innerHTML = 
      '<div class="status" style="color:var(--mb-dark)">' + e.message + '</div>';
  } finally {
    btn.classList.remove('loading');
    btn.innerHTML = 'Search';
  }
}

function renderResults(d) {
  const el = document.getElementById('results');
  if (!d.results || d.results.length === 0) {
    el.innerHTML = '<div class="status">No results found for "' + esc(d.query) + '"</div>';
    return;
  }

  const modeLabel = { semantic: 'Semantic', keyword: 'Keyword', hybrid: 'Hybrid' };
  const html = d.results.map((r, i) => {
    const url = r.permalink ? 'https://heavenletters.org/' + r.permalink : '#';
    const num = r.publish_number ? '#' + r.publish_number : '';
    const source = modeLabel[r.source] || r.source;
    const date = r.published_date ? r.published_date.slice(0, 10) : '';

    return '<div class="result">' +
      '<div class="result-header">' +
        '<span class="result-title"><a href="' + url + '" target="_blank">' + 
          esc(r.title || 'Heavenletter') + '</a></span>' +
        '<span class="result-number">' + esc(num) + '</span>' +
      '</div>' +
      '<div class="result-excerpt">' + esc(r.excerpt || '') + '</div>' +
      '<div class="result-meta">' +
        '<span>' + esc(source) + '</span>' +
        '<span>score: ' + r.score.toFixed(4) + '</span>' +
        (date ? '<span>' + esc(date) + '</span>' : '') +
        '<span>' + esc(d.embedding_backend || '') + '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  el.innerHTML = html;
}

// ═══ Analyze ═══════════════════════════════════════════════════════
async function doAnalyze(query, topK) {
  const el = document.getElementById('analyze-result');
  el.style.display = 'block';
  el.innerHTML = '<h3>Analysis</h3><div class="status">Analyzing…<span class="spinner"></span></div>';

  try {
    const r = await fetch(API + '/analyze', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ query, top_k: topK })
    });
    if (!r.ok) {
      const d = await r.json();
      throw new Error(d.detail || 'Analysis failed');
    }
    const d = await r.json();
    lastAnalysis = { analysis: d.analysis, sources: d.sources || [] };

    let html = '<h3>Analysis</h3>';

    if (d.sources && d.sources.length > 0) {
      html += '<div class="source-list">Based on: ';
      html += d.sources.map(s => {
        const url = s.permalink ? 'https://heavenletters.org/' + s.permalink : '#';
        return '<span class="source-item"><a href="' + url + '" target="_blank">Heavenletter #' + 
          esc(String(s.publish_number)) + ': ' + esc(s.title) + '</a></span>';
      }).join(', ');
      html += '</div>';
    }

    html += marked.parse(d.analysis);

    if (d.tokens_used) {
      html += '<div class="result-meta"><span>' + d.tokens_used + ' tokens</span></div>';
    }

    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<h3>Analysis</h3><p style="color:var(--mb-dark)">' + e.message + '</p>';
  }
}

function toggleAnalyze() {}

// ═══ Share ══════════════════════════════════════════════════════════
async function doShare() {
  if (!lastResults) return;
  const btn = document.getElementById('share-btn');
  const orig = btn.textContent;
  btn.textContent = 'Sharing…';
  btn.style.opacity = '0.7';

  try {
    const r = await fetch(API + '/share', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({
        query: lastQuery, mode: lastMode, results: lastResults,
        analysis: lastAnalysis ? lastAnalysis.analysis : '',
        sources: lastAnalysis ? lastAnalysis.sources : [],
        backend: lastBackend
      })
    });
    const d = await r.json();
    const url = window.location.origin + d.url;
    await navigator.clipboard.writeText(url);
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = orig; btn.style.opacity = '1'; }, 2000);
  } catch(e) {
    btn.textContent = 'Failed';
    btn.style.opacity = '1';
    setTimeout(() => { btn.textContent = orig; }, 2000);
  }
}

// ═══ Helpers ═══════════════════════════════════════════════════════
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
